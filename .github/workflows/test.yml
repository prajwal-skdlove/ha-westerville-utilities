name: Tests

on:
  push:
  pull_request:

jobs:
  client:
    name: Client tests (no HA dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --python 3.14
      - name: Run tests/client
        run: uv run pytest tests/client/ -v --cov=custom_components/westerville_utilities/client --cov-report=term-missing

  ha:
    name: Home Assistant tests (Linux only -- see tests/README.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --python 3.14 --group ha-test
      - name: Run tests/ha
        run: uv run pytest tests/ha/ -v --cov=custom_components/westerville_utilities --cov-report=term-missing
